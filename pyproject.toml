[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-site-auditor"
version = "0.1.0"
description = "A passive website security posture checker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Change Muriuki" }]
keywords = ["security", "https", "tls", "security-headers", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/changemk/secure-site-auditor"
Repository = "https://github.com/changemk/secure-site-auditor"
Issues = "https://github.com/changemk/secure-site-auditor/issues"

[project.scripts]
site-audit = "secure_site_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
